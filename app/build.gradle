plugins {
    id 'com.android.application'
    id 'com.google.protobuf'
}

android {
    namespace 'ar.goro.ai'
    compileSdk 36
    defaultConfig {
        applicationId providers.gradleProperty('goroApplicationId').getOrElse('ar.goro.ai.personal')
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            // Installable sideload build. Replace with the owner's private release keystore before store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.5' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.68.1' } }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java {} }
            task.plugins { grpc {} }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.aar'], dir: 'libs')
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'io.grpc:grpc-okhttp:1.68.1'
    implementation 'io.grpc:grpc-protobuf:1.68.1'
    implementation 'io.grpc:grpc-stub:1.68.1'
    implementation 'com.google.protobuf:protobuf-java:3.25.5'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.android.filament:filament-android:1.70.0'
    implementation 'com.google.android.filament:gltfio-android:1.70.0'
    implementation 'com.google.android.filament:filament-utils-android:1.70.0'
    testImplementation 'androidx.work:work-testing:2.10.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
