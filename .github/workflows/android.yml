name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Install Android 36 SDK and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
      - name: Static security gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.BLUETOOTH_PRIVILEGED' not in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          for p in Path('app/src').rglob('*.java'):
            s=p.read_text()
            assert not re.search(r'nvapi-[A-Za-z0-9_-]{12,}',s),f'Embedded NVIDIA key in {p}'
          print('Static security gate PASS')
          PY
      - name: Unit tests and build
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug
      - name: Android memory persistence tests (Robolectric)
        run: gradle --no-daemon testDebugUnitTest
      - name: Validate manifest and APK
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import zipfile
          root=ET.parse('app/src/main/AndroidManifest.xml').getroot()
          android='{http://schemas.android.com/apk/res/android}'
          permissions={x.attrib.get(android+'name') for x in root.findall('uses-permission')}
          assert 'android.permission.INTERNET' in permissions
          assert 'android.permission.BLUETOOTH_PRIVILEGED' not in permissions
          activities=root.findall('.//activity')
          assert len(activities)==1 and activities[0].attrib.get(android+'exported')=='true'
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>0
          with zipfile.ZipFile(apk) as z:
            assert z.testzip() is None
            assert 'AndroidManifest.xml' in z.namelist()
          print('Manifest, permissions, APK ZIP integrity: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GoroAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
