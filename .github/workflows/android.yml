name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Fetch pinned JieLi RCSP 4.2.0 SDK
        run: |
          set -euo pipefail
          mkdir -p app/libs
          BASE="https://raw.githubusercontent.com/Jieli-Tech/Android-JL_Bluetooth/6293873b641ffd8d461773873ecedef1a9d9038d/code/PiHome_V1.13.0_SDK_V4.2.0/btsmart/libs"
          curl --fail --location --retry 3 "$BASE/jl_bluetooth_rcsp_V4.2.0_40250-release.aar" -o app/libs/jl_bluetooth_rcsp_V4.2.0_40250-release.aar
          curl --fail --location --retry 3 "$BASE/jldecryption_v0.4-release.aar" -o app/libs/jldecryption_v0.4-release.aar
          curl --fail --location --retry 3 "$BASE/GifConvert_V1.3.0_42-release.aar" -o app/libs/GifConvert_V1.3.0_42-release.aar
          curl --fail --location --retry 3 "$BASE/BmpConvert_V1.6.0_10605-release.aar" -o app/libs/BmpConvert_V1.6.0_10605-release.aar
          curl --fail --location --retry 3 "$BASE/jl_audio_decode_V2.1.0_20012-release.aar" -o app/libs/jl_audio_decode_V2.1.0_20012-release.aar
          test "$(stat -c%s app/libs/jl_bluetooth_rcsp_V4.2.0_40250-release.aar)" = "1284165"
          test "$(stat -c%s app/libs/jldecryption_v0.4-release.aar)" = "42233"
          test "$(stat -c%s app/libs/GifConvert_V1.3.0_42-release.aar)" = "355226"
          test "$(stat -c%s app/libs/BmpConvert_V1.6.0_10605-release.aar)" = "621482"
          test "$(git hash-object app/libs/jl_bluetooth_rcsp_V4.2.0_40250-release.aar)" = "96be927894a69eb4af1fcc7dc1191a337360f86e"
          test "$(git hash-object app/libs/jldecryption_v0.4-release.aar)" = "fd933770e05afe815240922641a76fe62be7778b"
          test "$(git hash-object app/libs/GifConvert_V1.3.0_42-release.aar)" = "2d586af21f244f5337f29a0f656eac2186b40f6f"
          test "$(git hash-object app/libs/BmpConvert_V1.6.0_10605-release.aar)" = "00f1fafab6e4fc1357f09b20275b7d5c7fd7d2c8"
          test "$(stat -c%s app/libs/jl_audio_decode_V2.1.0_20012-release.aar)" = "1445327"
          test "$(git hash-object app/libs/jl_audio_decode_V2.1.0_20012-release.aar)" = "1a609561d533cdbbd161459eece838e2038f85ed"
      - name: Install Android 36 SDK and build tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
      - name: Static security gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          assert 'android.permission.BLUETOOTH_PRIVILEGED' not in manifest
          assert 'android:usesCleartextTraffic="false"' in manifest
          for p in Path('app/src').rglob('*.java'):
            s=p.read_text()
            assert not re.search(r'nvapi-[A-Za-z0-9_-]{12,}',s),f'Embedded NVIDIA key in {p}'
          print('Static security gate PASS')
          PY
      - name: Generate and verify GORO articulated humanoid GLB
        run: |
          python3 scripts/generate_goro_glb.py
          python3 - <<'PY'
          import json,struct
          from pathlib import Path
          f=Path('app/src/main/assets/goro/goro_rigged.glb')
          b=f.read_bytes()
          assert b[:4]==b'glTF'
          assert struct.unpack_from('<II',b,4)==(2,len(b))
          l=struct.unpack_from('<I',b,12)[0]
          doc=json.loads(b[20:20+l])
          assert len(doc['skins'])>=1 and len(doc['animations'])>=6
          assert len(doc['meshes'][1]['extras']['targetNames'])==10
          for animation in doc['animations']:
            for sampler in animation['samplers']:
              accessor=doc['accessors'][sampler['input']]
              assert accessor['type']=='SCALAR' and 'min' in accessor and 'max' in accessor
              assert accessor['min'][0]<=0 and accessor['max'][0]>=1.8
          for mesh in doc['meshes']:
            for primitive in mesh['primitives']:
              attrs=primitive['attributes']
              assert 'TEXCOORD_0' in attrs and 'JOINTS_0' in attrs and 'WEIGHTS_0' in attrs
          assert doc['materials'] and doc['textures']
          print('GORO rig geometry and animation contract PASS',len(b))
          PY
      - name: Validate GORO ZNP animation asset
        run: python3 scripts/validate_znp_animation.py
      - name: Unit tests and build
        run: gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
      - name: Android memory persistence tests (Robolectric)
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoroAI-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Validate manifest and APK
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          import zipfile
          root=ET.parse('app/src/main/AndroidManifest.xml').getroot()
          android='{http://schemas.android.com/apk/res/android}'
          permissions={x.attrib.get(android+'name') for x in root.findall('uses-permission')}
          assert 'android.permission.INTERNET' in permissions
          assert 'android.permission.BLUETOOTH_PRIVILEGED' not in permissions
          activities=root.findall('.//activity')
          assert len(activities)==1 and activities[0].attrib.get(android+'exported')=='true'
          for apk in [Path('app/build/outputs/apk/debug/app-debug.apk'),
                      Path('app/build/outputs/apk/release/app-release-unsigned.apk')]:
            assert apk.is_file() and apk.stat().st_size>0, f'Missing APK: {apk}'
            with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              assert 'AndroidManifest.xml' in z.namelist()
          print('Manifest, permissions, debug and release APK ZIP integrity: PASS')
          PY
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "${SDK_ROOT}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          echo "Release compiled unsigned; owner certificate is supplied only for private builds."
      - name: Check 12-of-12 release readiness without claiming completion
        if: always()
        run: python3 scripts/release_gate.py --report build/goro-release-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GoroAI-release-readiness
          path: build/goro-release-readiness.json
      - uses: actions/upload-artifact@v4
        with:
          name: GoroAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GoroAI-unsigned-release-apk
          path: app/build/outputs/apk/release/*.apk
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Fetch pinned JieLi RCSP 4.2.0 SDK for emulator tests
        run: |
          set -euo pipefail
          mkdir -p app/libs
          BASE="https://raw.githubusercontent.com/Jieli-Tech/Android-JL_Bluetooth/6293873b641ffd8d461773873ecedef1a9d9038d/code/PiHome_V1.13.0_SDK_V4.2.0/btsmart/libs"
          curl --fail --location --retry 3 "$BASE/jl_bluetooth_rcsp_V4.2.0_40250-release.aar" -o app/libs/jl_bluetooth_rcsp_V4.2.0_40250-release.aar
          curl --fail --location --retry 3 "$BASE/jldecryption_v0.4-release.aar" -o app/libs/jldecryption_v0.4-release.aar
          curl --fail --location --retry 3 "$BASE/GifConvert_V1.3.0_42-release.aar" -o app/libs/GifConvert_V1.3.0_42-release.aar
          curl --fail --location --retry 3 "$BASE/BmpConvert_V1.6.0_10605-release.aar" -o app/libs/BmpConvert_V1.6.0_10605-release.aar
          curl --fail --location --retry 3 "$BASE/jl_audio_decode_V2.1.0_20012-release.aar" -o app/libs/jl_audio_decode_V2.1.0_20012-release.aar
          test "$(git hash-object app/libs/jl_bluetooth_rcsp_V4.2.0_40250-release.aar)" = "96be927894a69eb4af1fcc7dc1191a337360f86e"
          test "$(git hash-object app/libs/jldecryption_v0.4-release.aar)" = "fd933770e05afe815240922641a76fe62be7778b"
          test "$(git hash-object app/libs/GifConvert_V1.3.0_42-release.aar)" = "2d586af21f244f5337f29a0f656eac2186b40f6f"
          test "$(git hash-object app/libs/BmpConvert_V1.6.0_10605-release.aar)" = "00f1fafab6e4fc1357f09b20275b7d5c7fd7d2c8"
          test "$(stat -c%s app/libs/jl_audio_decode_V2.1.0_20012-release.aar)" = "1445327"
          test "$(git hash-object app/libs/jl_audio_decode_V2.1.0_20012-release.aar)" = "1a609561d533cdbbd161459eece838e2038f85ed"
      - name: Generate GORO articulated model for emulator
        run: python3 scripts/generate_goro_glb.py
      - name: Enable KVM acceleration on GitHub runner
        run: |
          set -euo pipefail
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            test -r /dev/kvm && test -w /dev/kvm
            echo "KVM access available to Android emulator"
          else
            echo "::warning::KVM unavailable; Android emulator will use slow software emulation"
          fi
      - name: Android emulator launch and navigation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data -camera-back none
          script: bash scripts/run_emulator_smoke.sh
      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GoroAI-emulator-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/**/*.xml
            build/goro-emulator-logcat.txt
            build/goro-emulator-ui.png
            build/goro-emulator-gfxinfo.txt
          if-no-files-found: warn

